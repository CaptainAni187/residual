[project]
name = "residual"
version = "0.1.0"
description = "Cash variance controller for merchant settlements."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
    "duckdb>=1.1",
    "typer>=0.15",
    "rich>=13.9",
    "pdfplumber>=0.11.10",
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
]

[project.optional-dependencies]
agent = ["anthropic>=0.42"]
serve = ["uvicorn>=0.34"]

[project.scripts]
residual = "residual.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.122",
    "ruff>=0.8",
    "mypy>=1.14",
    "httpx>=0.28",
    "reportlab>=5.0.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
files = ["src/residual"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
