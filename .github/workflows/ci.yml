name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check src tests

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q --cov=residual --cov-report=term

      - name: Walk the guided demo
        run: uv run residual demo --no-pause

      - name: Deterministic simulation testing
        run: uv run residual dst --seeds 400

      - name: Reproduce the reported numbers
        run: |
          uv run residual evaluate
          uv run residual ablate
          uv run residual backtest-forecast --horizon 14
          uv run residual calibration
          uv run residual rediscover --all-weeks
          uv run residual rediscover --all-weeks --baseline
          uv run residual rediscover --week 8 --recorded tests/fixtures/proposals/week8.json
          uv run residual certify-forecast --days 400

      - name: Close a real gateway report against a real bank statement
        run: |
          uv run residual reconcile \
            --recon tests/fixtures/recon_march.json \
            --statement tests/fixtures/statements/hdfc.csv \
            --contract "card=2.00" \
            --gstr2b tests/fixtures/gst/gstr2b_march.json

      - name: Seal a close pack and verify it round-trips
        run: uv run residual pack --week 8

      - name: Refuse bad input cleanly
        run: |
          set +e
          out=$(uv run residual bank-statement --file /nope.csv 2>&1); code=$?
          set -e
          echo "$out"
          [ "$code" = "2" ] || { echo "expected exit 2, got $code"; exit 1; }
          echo "$out" | grep -q "Traceback" && { echo "stack trace leaked"; exit 1; }
          echo "refused cleanly"
